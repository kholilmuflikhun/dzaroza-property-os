name: Phase 0.5 OS Quality Gates
on:
  push:
    branches: [feat/phase-0-source-preservation]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dzaroza_test
          POSTGRES_PASSWORD: dzaroza_test
          POSTGRES_DB: dzaroza_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dzaroza_test -d dzaroza_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://dzaroza_test:dzaroza_test@localhost:5432/dzaroza_test?schema=public
      DIRECT_URL: postgresql://dzaroza_test:dzaroza_test@localhost:5432/dzaroza_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Frozen dependency installation
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client (no migration)
        run: pnpm db:generate
      - name: Apply migration chain to isolated CI database
        run: pnpm --filter @dzaroza/database exec prisma migrate deploy --schema prisma/schema.prisma
      - name: Verify tenant-scoped relational constraints
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/prisma/tests/tenant-integrity.sql
      - name: OS TypeScript
        run: pnpm --filter @dzaroza/ops typecheck
      - name: OS unit tests
        run: pnpm --filter @dzaroza/ops test
      - name: Production build (no deployment)
        run: pnpm --filter @dzaroza/ops build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
