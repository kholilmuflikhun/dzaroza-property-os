name: Phase 0.5 OS Quality Gates
on:
  push:
    branches: [feat/phase-0-source-preservation]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Frozen dependency installation
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client (no migration)
        run: pnpm db:generate
      - name: OS TypeScript
        run: pnpm --filter @dzaroza/ops typecheck
      - name: OS unit tests
        run: pnpm --filter @dzaroza/ops test
      - name: Production build (no deployment)
        run: pnpm --filter @dzaroza/ops build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
